# crisp-english configuration - ONE file, read by all four languages.
#
# This file exists because three separate comments in this project used to say
# "THIS NUMBER EXISTS IN FOUR PLACES and they have to agree", listing the other
# three by hand. Python, Lua, shell and launchd cannot share a constant, but they
# can all read the same trivial file, and that is what they now do:
#
#   corrector.py   read_config_file()
#   ollama.lua     config.lua
#   crisp-englishctl       crisp_config()
#   the plist      install.sh bakes the resolved path in and sh parses it
#
# FORMAT: KEY=value, one per line. No spaces around "=", no shell expansion, no
# quotes needed (quotes are stripped if you use them). Anything after " #" is a
# comment. That is the largest subset of syntax all four parsers agree on.
#
# PRECEDENCE: environment variable > ~/.crisp-english/crisp-english.conf > this file > built-in
# default. So you can override any of this per-machine without editing the repo:
#
#   mkdir -p ~/.crisp-english && echo 'CRISP_ENGLISH_MODEL=qwen3:8b' >> ~/.crisp-english/crisp-english.conf
#
# After editing: crisp-englishctl reload

# The model. qwen3:4b is the measured sweet spot on a 16GB machine, and the
# reasoning is written here rather than in a design document because the document
# is gone and this is where someone changing the value will be looking.
#
# Benchmarked, not estimated. With the deterministic layer in blocklist.py doing
# the closed-form work, qwen3:4b matches qwen3:8b on quality at 1.7x the speed
# and half the memory: 0.9s to a usable answer against 1.5s, 2.5GB against 5.2GB.
# Paying double the latency and double the RAM bought nothing measurable.
#
# gemma3:4b is disqualified on behaviour rather than score: it silently drops
# content. "The deployment is done. Please verify and confirm." came back as
# "Please verify and confirm." - the first sentence simply gone - and a message
# with a greeting and two sentences came back with the greeting and the second
# sentence missing. A tool that quietly deletes half a message is worse than no
# tool, so no score would have rescued it.
CRISP_ENGLISH_MODEL=qwen3:4b

# How long Ollama keeps the model resident after a correction.
#
# It was 8h, paired with a launch agent that re-warmed every 7h, which together
# meant the model never unloaded at all: 2.9GB of a 16GB machine held around the
# clock, overnight and on battery, whether or not anything was corrected that
# day. The measured cost was 148k pageouts and other apps swapping. 1h lets it
# release itself once you stop writing. Corrections cluster, so the cost is a
# handful of cold loads a day rather than one per message.
CRISP_ENGLISH_KEEP_ALIVE=1h

# Context window. MUST be the same for every request, including the warm-ups:
# Ollama keys its loaded-model cache on the options, so warming with a different
# num_ctx loads the model a SECOND time and wastes the warm-up entirely.
#
# Without this set, Ollama honours the model's advertised maximum. qwen3:4b
# advertises 262144, which reserves 42GB, does not fit in 16GB, and silently
# spills inference onto the CPU: the slowest and most battery-hungry outcome.
#
# The input-size cap is DERIVED from this number in corrector.py rather than
# being a round number of its own - see max_chars().
CRISP_ENGLISH_NUM_CTX=2048

# Keep the text of your messages in ~/.crisp-english/mistakes.log.
#
# The log is what `crisp-englishctl stats`, `crisp-englishctl last` and `crisp-englishctl again` read.
# Set to 0 and only the grammar-rule names are kept: stats still works, `last`
# and `again` stop working, and no message text is ever written to disk.
#
# Worth a thought: crisp-english's promise is that nothing leaves your Mac, and this
# file is the one place your messages accumulate.
CRISP_ENGLISH_LOG_TEXT=1

# Entries to keep in the log. Oldest are dropped past this.
CRISP_ENGLISH_LOG_MAX=2000

# Pick the audience from the app you are writing in: Slack and WhatsApp get
# "brief", Mail and Outlook get "formal". The menu bar choice becomes the
# fallback for everything else. Set to 0 to always use the menu choice.
CRISP_ENGLISH_AUTO_TONE=1
